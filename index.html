<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kris Kater</title>
<meta name="description" content="Senior software engineer in the Netherlands — backend architecture, mostly C# and .NET.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
    --rule: #e2e2e2;
    --link: #0b5cab;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c;
      --fg: #e8e8e8;
      --muted: #a0a4ab;
      --rule: #2c3038;
      --link: #79b8ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c;
    --fg: #e8e8e8;
    --muted: #a0a4ab;
    --rule: #2c3038;
    --link: #79b8ff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 4rem 16px;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  main { max-width: 32rem; width: 100%; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 1.25rem; }
  p { margin: 0 0 1rem; }
  .links {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-size: .95rem;
    color: var(--muted);
  }
  .links a { color: var(--link); }
  .links span { margin: 0 .5rem; color: var(--rule); }
</style>
</head>
<body>
<main>
  <h1>Kris Kater</h1>

  <p>
    Senior software engineer in the Netherlands — backend architecture, mostly C# and .NET.
  </p>
  <p>
    I like systems that are simple enough to reason about and honest enough to say when they
    have broken. Most of what I build is private.
  </p>

  <p class="links">
    <a href="https://github.com/mike-echo-oscar-whiskey">GitHub</a>
    <span>·</span>
    <a href="media-stack-archive/">media-stack-archive</a>
  </p>
</main>
</body>
</html>
